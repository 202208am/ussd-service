
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USSD Simulator</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(135deg,#101827,#25395b);
  font-family: Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.phone {
  width: 350px;
  max-width: 100%;
  background: #10151f;
  border: 7px solid #343d4b;
  border-radius: 38px;
  padding: 22px;
  color: white;
  box-shadow: 0 25px 70px #0008;
}
.header {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  margin-bottom: 25px;
}
.screen {
  background: #202c40;
  border-radius: 16px;
  padding: 18px;
  min-height: 180px;
  margin-bottom: 20px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  line-height: 1.6;
}
input {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  border: 1px solid #56637a;
  background: #151e2e;
  color: white;
  font-size: 17px;
  margin-bottom: 12px;
}
.keys {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  gap: 10px;
  margin: 12px 0;
}
button {
  padding: 15px;
  border: 0;
  border-radius: 12px;
  background: #34445e;
  color: white;
  font-size: 19px;
  cursor: pointer;
}
button:hover { background: #486083; }
.actions {
  display: flex;
  gap: 10px;
}
.actions button {
  flex: 1;
  font-size: 15px;
}
.call { background: #16a765; }
.end { background: #cf4050; }
.status {
  font-size: 12px;
  color: #a9b7ce;
  margin-top: 12px;
  text-align: center;
}
</style>
</head>
<body>
<div class="phone">
  <div class="header">
    <span>USSD SERVICE</span>
    <span>● ● ● 100%</span>
  </div>

  <div class="screen" id="screen">Введите USSD-код для начала.</div>

  <input id="msisdn"
    value="996700111111"
    placeholder="Номер абонента">

  <select id="language" style="width:100%;padding:12px;border-radius:10px;border:1px solid #56637a;background:#151e2e;color:white;font-size:15px;margin-bottom:12px;">
    <option value="ru">Русский</option>
    <option value="ky">Кыргызча</option>
  </select>

  <input id="entry"
    value="*123#"
    placeholder="USSD-код или ответ">

  <div class="keys" id="keys"></div>

  <div class="actions">
    <button class="call" id="send-button" onclick="sendUSSD()">
      Отправить
    </button>
    <button class="end" id="end-button" onclick="resetSession()">
      Завершить
    </button>
  </div>

  <div class="status" id="status">
    Готов к подключению
  </div>
</div>

<script>
const entry = document.getElementById("entry");
const screen = document.getElementById("screen");
const statusEl = document.getElementById("status");

let sessionId = crypto.randomUUID();
let active = false;
let lastReadOnlyCode = null;
const language = document.getElementById("language");
const msisdnInput = document.getElementById("msisdn");
const uiText = {
  ru: {
    initial: "Введите USSD-код для начала.",
    phone: "Номер абонента",
    code: "USSD-код или ответ",
    send: "Отправить",
    end: "Завершить",
    ready: "Готов к подключению",
    sending: "Отправка запроса...",
    missing: "Введите номер и команду.",
    apiError: "Ошибка API: ",
    active: "USSD-сессия активна",
    finished: "USSD-сессия завершена",
    connectionError: "Ошибка подключения: ",
    offline: "Нет соединения",
    ended: "Сессия завершена. Введите USSD-код.",
    switched: "Язык переключён. Отправьте USSD-код, чтобы получить данные на выбранном языке."
  },
  ky: {
    initial: "Баштоо үчүн USSD-кодду киргизиңиз.",
    phone: "Абоненттин номери",
    code: "USSD-код же жооп",
    send: "Жөнөтүү",
    end: "Аяктоо",
    ready: "Туташууга даяр",
    sending: "Сурам жөнөтүлүүдө...",
    missing: "Номерди жана буйрукту киргизиңиз.",
    apiError: "API катасы: ",
    active: "USSD-сеанс активдүү",
    finished: "USSD-сеанс аяктады",
    connectionError: "Туташуу катасы: ",
    offline: "Байланыш жок",
    ended: "Сеанс аяктады. USSD-кодду киргизиңиз.",
    switched: "Тил өзгөртүлдү. Тандалган тилдеги маалыматты алуу үчүн USSD-кодду жөнөтүңүз."
  }
};

function updateInterfaceLanguage() {
  const t = uiText[language.value] || uiText.ru;
  document.documentElement.lang = language.value;
  msisdnInput.placeholder = t.phone;
  entry.placeholder = t.code;
  document.getElementById("send-button").textContent = t.send;
  document.getElementById("end-button").textContent = t.end;
  statusEl.textContent = t.ready;
  screen.textContent = active ? screen.textContent : t.initial;
}

for (const key of ["1","2","3","4","5","6",
                   "7","8","9","*","0","#"]) {
  const button = document.createElement("button");
  button.textContent = key;
  button.onclick = () => entry.value += key;
  document.getElementById("keys").appendChild(button);
}

function resetSession() {
  sessionId = crypto.randomUUID();
  active = false;
  lastReadOnlyCode = null;
  entry.value = "*123#";
  const t = uiText[language.value] || uiText.ru;
  screen.textContent = t.ended;
  statusEl.textContent = t.ready;
}

async function refreshUSSD() {
  const t = uiText[language.value] || uiText.ru;
  const msisdn = msisdnInput.value.trim();
  try {
    const response = await fetch("/api/v1/ussd/", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        msisdn,
        session_id: sessionId,
        input: "",
        language: language.value,
        refresh: true
      })
    });
    const data = await response.json();
    screen.textContent = data.text ?? JSON.stringify(data, null, 2);
    if (!response.ok || data.end) {
      active = false;
      statusEl.textContent = t.ready;
    } else {
      statusEl.textContent = t.active;
    }
  } catch (error) {
    screen.textContent = t.connectionError + error.message;
    statusEl.textContent = t.offline;
  }
}

async function refreshReadOnlyResult() {
  const t = uiText[language.value] || uiText.ru;
  try {
    const response = await fetch("/api/v1/ussd/", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        msisdn: msisdnInput.value.trim(),
        session_id: sessionId,
        input: lastReadOnlyCode,
        language: language.value
      })
    });
    const data = await response.json();
    screen.textContent = data.text ?? JSON.stringify(data, null, 2);
    statusEl.textContent = response.ok ? t.finished : t.apiError + response.status;
  } catch (error) {
    screen.textContent = t.connectionError + error.message;
    statusEl.textContent = t.offline;
  }
}

async function sendUSSD() {
  const msisdn = document.getElementById("msisdn").value.trim();
  const value = entry.value.trim();

  if (!msisdn || !value) {
    screen.textContent = (uiText[language.value] || uiText.ru).missing;
    return;
  }

  const userInput = value;
  lastReadOnlyCode = null;

  const t = uiText[language.value] || uiText.ru;
  statusEl.textContent = t.sending;

  try {
    const response = await fetch("/api/v1/ussd/", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        msisdn: msisdn,
        session_id: sessionId,
        input: userInput,
        language: document.getElementById("language").value
      })
    });

    const data = await response.json();

    screen.textContent = data.text ??
      JSON.stringify(data, null, 2);

    if (!response.ok) {
      statusEl.textContent = t.apiError + response.status;
      return;
    }

    active = data.end !== true;
    lastReadOnlyCode = !active && ["*100#", "*102#"].includes(userInput)
      ? userInput
      : null;
    entry.value = "";

    statusEl.textContent = active
      ? t.active
      : t.finished;

    if (!active) {
      sessionId = crypto.randomUUID();
    }

  } catch (error) {
    screen.textContent = t.connectionError + error.message;
    statusEl.textContent = t.offline;
  }
}

entry.addEventListener("keydown", event => {
  if (event.key === "Enter") sendUSSD();
});

language.addEventListener("change", () => {
  updateInterfaceLanguage();
  if (active) {
    refreshUSSD();
  } else if (lastReadOnlyCode) {
    refreshReadOnlyResult();
  } else {
    screen.textContent = (uiText[language.value] || uiText.ru).switched;
  }
});

updateInterfaceLanguage();
</script>
</body>
</html>
