
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USSD Simulator</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(135deg,#101827,#25395b);
  font-family: Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

.phone {
  width: 350px;
  max-width: 100%;
  background: #10151f;
  border: 7px solid #343d4b;
  border-radius: 38px;
  padding: 22px;
  color: white;
  box-shadow: 0 25px 70px #0008;
}

.header {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  margin-bottom: 25px;
}

.screen {
  background: #202c40;
  border-radius: 16px;
  padding: 18px;
  min-height: 150px;
  margin-bottom: 20px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  line-height: 1.6;
}

input {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  border: 1px solid #56637a;
  background: #151e2e;
  color: white;
  font-size: 17px;
  margin-bottom: 12px;
}

select {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid #56637a;
  background: #151e2e;
  color: white;
  font-size: 15px;
  margin-bottom: 12px;
}

/* Круглая клавиатура телефона */
.keys {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  justify-items: center;
  gap: 12px;
  margin: 20px 0;
}

button {
  border: 0;
  color: white;
  cursor: pointer;
}

.keys button {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  background: #34445e;
  color: white;
  font-size: 28px;
  font-weight: 400;
  padding: 0;
  transition: background 0.15s, transform 0.1s;
}

.keys button:hover {
  background: #486083;
}

.keys button:active {
  background: #607a9e;
  transform: scale(0.95);
}

.actions {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 35px;
  margin-top: 25px;
}

.actions button {
  flex: none;
  width: 68px;
  height: 68px;
  border-radius: 50%;
  padding: 0;
  font-size: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.call { background: #16a765; }
.end { background: #cf4050; }

.call:hover { background: #128a54; }
.end:hover { background: #b93444; }

.status {
  font-size: 12px;
  color: #a9b7ce;
  margin-top: 12px;
  text-align: center;
}

@media (max-width: 380px) {
  .phone {
    padding: 16px;
    border-width: 5px;
  }

  .keys {
    gap: 10px;
  }

  .keys button {
    width: min(72px, 100%);
    aspect-ratio: 1;
    height: auto;
  }
}
/* Затемнение экрана */
.ussd-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.65);
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 20px;
}

/* Всплывающее USSD-окно */
.ussd-popup {
  width: 340px;
  max-width: 100%;
  background: #f5f5f5;
  color: #202124;
  border-radius: 22px;
  padding: 24px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
  font-family: Arial, sans-serif;
}

.ussd-popup-title {
  font-size: 19px;
  font-weight: bold;
  margin-bottom: 20px;
}

.ussd-popup-message {
  font-size: 16px;
  line-height: 1.6;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  max-height: 45vh;
  overflow-y: auto;
  margin-bottom: 20px;
}

#ussd-popup-input {
  width: 100%;
  background: transparent;
  color: #202124;
  border: none;
  border-bottom: 2px solid #1683e8;
  border-radius: 0;
  padding: 12px 4px;
  font-size: 17px;
  outline: none;
  margin-bottom: 22px;
}

.ussd-popup-actions {
  display: flex;
  justify-content: flex-end;
  gap: 22px;
}

.ussd-popup-actions button {
  background: transparent;
  color: #1683e8;
  font-size: 15px;
  font-weight: bold;
  padding: 10px 4px;
  border: none;
  cursor: pointer;
}

.ussd-popup-actions button:hover {
  color: #0056a8;
}
</style>
</head>

<body>
<div class="phone">
  <div class="header">
    <span>USSD SERVICE</span>
    <span>● ● ● 100%</span>
  </div>

  <div class="screen" id="screen">
Введите USSD-код для начала.</div>

  <input
    id="msisdn"
    value="996700111111"
    placeholder="Номер абонента"
  >

  <input type="hidden" id="language" value="ru">

  <input
    id="entry"
    value="*123#"
    placeholder="USSD-код или ответ"
  >

  <div class="keys" id="keys"></div>

  <div class="actions">
  <button class="call" id="send-button"
          onclick="sendUSSD()" aria-label="Отправить">
    ☎
  </button>

  <button class="end" id="end-button"
          onclick="resetSession()" aria-label="Завершить">
    ✕
  </button>
</div>

  <div class="status" id="status">
    Готов к подключению
  </div>
</div>

<div class="ussd-overlay" id="ussd-overlay">
  <div class="ussd-popup">
    <div class="ussd-popup-title">USSD SERVICE</div>

    <div class="ussd-popup-message" id="ussd-popup-message"></div>

    <input
      type="text"
      id="ussd-popup-input"
      placeholder="Введите ответ"
      autocomplete="off"
    >

    <div class="ussd-popup-actions">
      <button type="button" onclick="closeUSSDPopup()">Отмена</button>
      <button type="button" onclick="submitUSSDPopup()">Отправить</button>
    </div>
  </div>
</div>

<script>
// Элементы всплывающего USSD-окна
const ussdOverlay = document.getElementById("ussd-overlay");
const ussdPopupMessage = document.getElementById("ussd-popup-message");
const ussdPopupInput = document.getElementById("ussd-popup-input");

// Показываем USSD-окно
function showUSSDPopup(message, canReply = true) {
  ussdPopupMessage.textContent = message;
  ussdPopupInput.value = "";

  // Если ответ не требуется, скрываем поле ввода
  ussdPopupInput.style.display = canReply ? "block" : "none";

  // Настраиваем кнопки в зависимости от типа USSD-ответа
const popupButtons = document.querySelectorAll(
  ".ussd-popup-actions button"
);

const cancelButton = popupButtons[0];
const submitButton = popupButtons[1];

if (canReply) {
  // Меню, где пользователь должен ввести ответ
  cancelButton.style.display = "inline-block";
  submitButton.textContent = "ok";
} else {
  // Завершённый запрос, например проверка баланса
  cancelButton.style.display = "none";
  submitButton.textContent = "OK";
}

  ussdOverlay.style.display = "flex";

  if (canReply) {
    ussdPopupInput.focus();
  }
}

// Закрываем окно и завершаем сессию
function closeUSSDPopup() {
  ussdOverlay.style.display = "none";
  resetSession();
}

// Отправляем ответ из всплывающего окна
function submitUSSDPopup() {
  if (ussdPopupInput.style.display === "none") {
  closeUSSDPopup();
  return;
}
  const value = ussdPopupInput.value.trim();

  if (!value) {
  ussdPopupInput.focus();
  return;
}

  entry.value = value;
  ussdOverlay.style.display = "none";
  sendUSSD();
}
// Нажатие Enter на клавиатуре во всплывающем окне
ussdPopupInput.addEventListener("keydown", function(event) {
  if (event.key === "Enter") {
    event.preventDefault();
    submitUSSDPopup();
  }
});

const entry = document.getElementById("entry");
const screen = document.getElementById("screen");
const statusEl = document.getElementById("status");
const language = document.getElementById("language");
const msisdnInput = document.getElementById("msisdn");

let sessionId = crypto.randomUUID();
let active = false;
let lastReadOnlyCode = null;

// Проверяем, выбирал ли пользователь язык раньше
const savedLanguage = localStorage.getItem("ussd_language");

// Если язык уже сохранён, повторно не спрашиваем
let languageSelected = savedLanguage === "ru" || savedLanguage === "ky";

// Запоминаем первую USSD-команду
let pendingCode = "";

// Восстанавливаем сохранённый язык
if (languageSelected) {
  language.value = savedLanguage;
}

// Экран выбора языка
function showLanguageMenu() {
  screen.textContent =
    "Выберите язык / Тилди тандаңыз\n\n" +
    "1. Кыргызча\n" +
    "2. Русский";

  statusEl.textContent = "Введите 1 или 2";
}

const uiText = {
  ru: {
    initial: "Введите USSD-код для начала.",
    phone: "Номер абонента",
    code: "USSD-код или ответ",
    send: "Отправить",
    end: "Завершить",
    ready: "Готов к подключению",
    sending: "Отправка запроса...",
    missing: "Введите номер и команду.",
    apiError: "Ошибка API: ",
    active: "USSD-сессия активна",
    finished: "USSD-сессия завершена",
    connectionError: "Ошибка подключения: ",
    offline: "Нет соединения",
    ended: "Сессия завершена. Введите USSD-код.",
    switched: "Язык переключён. Отправьте USSD-код, чтобы получить данные на выбранном языке."
  },

  ky: {
    initial: "Баштоо үчүн USSD-кодду киргизиңиз.",
    phone: "Абоненттин номери",
    code: "USSD-код же жооп",
    send: "Жөнөтүү",
    end: "Аяктоо",
    ready: "Туташууга даяр",
    sending: "Сурам жөнөтүлүүдө...",
    missing: "Номерди жана буйрукту киргизиңиз.",
    apiError: "API катасы: ",
    active: "USSD-сеанс активдүү",
    finished: "USSD-сеанс аяктады",
    connectionError: "Туташуу катасы: ",
    offline: "Байланыш жок",
    ended: "Сеанс аяктады. USSD-кодду киргизиңиз.",
    switched: "Тил өзгөртүлдү. Тандалган тилдеги маалыматты алуу үчүн USSD-кодду жөнөтүңүз."
  }
};

function updateInterfaceLanguage() {
  const t = uiText[language.value] || uiText.ru;

  document.documentElement.lang = language.value;
  msisdnInput.placeholder = t.phone;
  entry.placeholder = t.code;

  document.getElementById("send-button").textContent = "☎";
document.getElementById("end-button").textContent = "✕";

document.getElementById("send-button").title = t.send;
document.getElementById("end-button").title = t.end;

document.getElementById("send-button").setAttribute("aria-label", t.send);
document.getElementById("end-button").setAttribute("aria-label", t.end);

  statusEl.textContent = t.ready;

  if (!active) {
    screen.textContent = t.initial;
  }
}

/* Создаём клавиатуру */
for (const key of [
  "1","2","3",
  "4","5","6",
  "7","8","9",
  "*","0","#"
]) {
  const button = document.createElement("button");
  button.type = "button";
  button.textContent = key;

  button.onclick = () => {
    entry.value += key;
  };

  document.getElementById("keys").appendChild(button);
}

function resetSession() {
  sessionId = crypto.randomUUID();
  active = false;
  lastReadOnlyCode = null;
  entry.value = "*123#";

  const t = uiText[language.value] || uiText.ru;

  screen.textContent = t.ended;
  statusEl.textContent = t.ready;
}

async function refreshUSSD() {
  const t = uiText[language.value] || uiText.ru;
  const msisdn = msisdnInput.value.trim();

  try {
    const response = await fetch("/api/v1/ussd/", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        msisdn,
        session_id: sessionId,
        input: "",
        language: language.value,
        refresh: true
      })
    });

    const data = await response.json();

    screen.textContent =
      data.text ?? JSON.stringify(data, null, 2);

    if (!response.ok || data.end) {
      active = false;
      statusEl.textContent = t.ready;
    } else {
      statusEl.textContent = t.active;
    }

  } catch (error) {
    screen.textContent = t.connectionError + error.message;
    statusEl.textContent = t.offline;
  }
}

async function refreshReadOnlyResult() {
  const t = uiText[language.value] || uiText.ru;

  try {
    const response = await fetch("/api/v1/ussd/", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        msisdn: msisdnInput.value.trim(),
        session_id: sessionId,
        input: lastReadOnlyCode,
        language: language.value
      })
    });

    const data = await response.json();

    screen.textContent =
      data.text ?? JSON.stringify(data, null, 2);

    statusEl.textContent = response.ok
      ? t.finished
      : t.apiError + response.status;

  } catch (error) {
    screen.textContent = t.connectionError + error.message;
    statusEl.textContent = t.offline;
  }
}

async function sendUSSD() {
  const msisdn = msisdnInput.value.trim();
  const value = entry.value.trim();

    // Первый запуск: предлагаем выбрать язык
  if (!languageSelected) {

    // Если пользователь уже видит меню выбора языка
    if (pendingCode) {

      if (value !== "1" && value !== "2") {
        showLanguageMenu();
        statusEl.textContent = "Введите 1 или 2 / 1 же 2 киргизиңиз";
        entry.value = "";
        return;
      }

      // 1 — Кыргызча, 2 — Русский
      language.value = value === "1" ? "ky" : "ru";
      languageSelected = true;

      // Сохраняем язык в браузере
      localStorage.setItem("ussd_language", language.value);

      // Восстанавливаем первоначальную команду
      const firstCode = pendingCode;
      pendingCode = "";

      updateInterfaceLanguage();
      entry.value = firstCode;

      // Выполняем команду на выбранном языке
      return sendUSSD();
    }

    // Сохраняем первую USSD-команду
    if (!value || !value.startsWith("*") || !value.endsWith("#")) {
      screen.textContent =
        "Введите USSD-код / USSD-кодду киргизиңиз";
      return;
    }

    pendingCode = value;
    entry.value = "";
    showLanguageMenu();
    return;
  }

  if (!msisdn || !value) {
    screen.textContent =
      (uiText[language.value] || uiText.ru).missing;
    return;
  }

  const userInput = value;
  lastReadOnlyCode = null;

  const t = uiText[language.value] || uiText.ru;
  statusEl.textContent = t.sending;

  try {
    const response = await fetch("/api/v1/ussd/", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        msisdn: msisdn,
        session_id: sessionId,
        input: userInput,
        language: language.value
      })
    });

    const data = await response.json();

    const message = data.text ?? JSON.stringify(data, null, 2);

screen.textContent = message;

if (!response.ok) {
  statusEl.textContent = t.apiError + response.status;
  showUSSDPopup(message, false);
  return;
}

active = data.end !== true;

// Показываем ответ Django во всплывающем окне
showUSSDPopup(message, active);

    lastReadOnlyCode =
      !active && ["*100#", "*102#"].includes(userInput)
        ? userInput
        : null;

    entry.value = "";

    statusEl.textContent = active
      ? t.active
      : t.finished;

    if (!active) {
      sessionId = crypto.randomUUID();
    }

  } catch (error) {
    screen.textContent = t.connectionError + error.message;
    statusEl.textContent = t.offline;
  }
}

entry.addEventListener("keydown", event => {
  if (event.key === "Enter") {
    sendUSSD();
  }
});

language.addEventListener("change", () => {
  updateInterfaceLanguage();

  if (active) {
    refreshUSSD();
  } else if (lastReadOnlyCode) {
    refreshReadOnlyResult();
  } else {
    screen.textContent =
      (uiText[language.value] || uiText.ru).switched;
  }
});

updateInterfaceLanguage();
</script>

</body>
</html>
